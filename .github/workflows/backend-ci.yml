name: Backend CI

on:
  pull_request:
    branches:
      - main
      - "sprint/*"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          git fetch --no-tags --prune --depth=1 origin ${{ github.base_ref }}
          changed=$(git diff --name-only --diff-filter=AM HEAD origin/${{ github.base_ref }} -- backend/ | wc -l)
          if [ "$changed" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The backend test-suite builds a throw-away database from the real migrations + seed
    # (tests/conftest.py), so CI runs a PostgreSQL service just like `docker compose up -d`.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: connectsphere
          POSTGRES_PASSWORD: connectsphere
          POSTGRES_DB: connectsphere
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U connectsphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://connectsphere:connectsphere@localhost:5433/connectsphere
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Migrations apply cleanly to an empty database
        run: uv run python -m app.dbtool ready --no-docs

      - name: Test
        run: uv run pytest --traceability=../docs/testing/TRACEABILITY.md

      - name: Upload traceability matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix
          path: docs/testing/TRACEABILITY.md
          retention-days: 30
