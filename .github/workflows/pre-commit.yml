name: Pre-commit Checks

# Runs the exact same hooks defined in .pre-commit-config.yaml against every file in the repo,
# so a contributor who never ran `pre-commit install` locally is still covered in CI — secret
# detection, YAML validity, trailing whitespace, large files, and lint/format, all enforced here
# regardless of local setup.
on:
  pull_request:
    branches:
      - main
      - "sprint/*"

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: pre-commit/action@v3.0.1
