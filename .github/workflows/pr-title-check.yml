name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main
      - "sprint/*"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
