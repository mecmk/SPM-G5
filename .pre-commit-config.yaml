repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        # ruff formats python inside markdown fences too, so .md must be in scope
        # or CI's `ruff format --check .` catches what this hook missed.
        types_or: [python, pyi, markdown]
        files: ^backend/

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.29.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint (oxlint)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: frontend-format
        name: frontend format (prettier --write)
        entry: npm --prefix frontend run format
        language: system
        # `prettier --write .` rewrites every supported file under frontend/,
        # markdown included, so the trigger list has to match or CI diverges.
        files: ^frontend/.*\.(ts|tsx|js|jsx|css|json|html|md)$
        pass_filenames: false
