[project]
name = "connectsphere-backend"
version = "0.1.0"
description = "ConnectSphere Event Services backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "story(id, ac=None): backlog story (and optional acceptance-criterion number) the test verifies",
]
filterwarnings = ["ignore::DeprecationWarning:starlette.testclient", "ignore::DeprecationWarning:fastapi.testclient"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# RET: no `else` after an `if` that exits, no bare variable before a `return`.
# Passes clean repo-wide as of adoption; see backend/STYLE.md "Automated enforcement".
select = ["E", "F", "I", "RET"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
